[package]
name = "rusty-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusty-browser-bridge = { path = "../browser-bridge" }
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
ring = "=0.17.14"
lol_html = "=3.0.1"
cssparser = "=0.38.0"
encoding_rs = "=0.8.42"
robotstxt = "=0.3.0"

[dev-dependencies]
tempfile = "=3.23.0"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
