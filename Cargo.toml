[workspace]
members = ["crates/engine", "crates/win32", "crates/browser-bridge", "crates/native-host"]
resolver = "2"

[workspace.package]
version = "0.3.0-beta.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net", "process"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream", "system-proxy"] }
url = "=2.5.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
